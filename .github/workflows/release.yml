name: Release

# Push a tag like v0.3.0 (matching package.json "version") to publish.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - run: npm run vsix
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath commitwise-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        run: npx --yes ovsx@0 publish commitwise-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: commitwise-*.vsix
