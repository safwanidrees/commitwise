name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - name: Integration tests (VS Code stable, fake claude)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      # Windows: unit tests only. The fake claude is a Node script, and on
      # Windows the extension deliberately launches only native claude.exe.
      - name: Integration tests (VS Code stable, fake claude)
        if: runner.os == 'macOS'
        run: npm run test:integration
      - name: Integration tests (VS Code 1.85, minimum engine)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:min
